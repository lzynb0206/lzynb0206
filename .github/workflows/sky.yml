name: Living scene

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      weather:
        description: "Pin the weather — clear/clouds/rain/snow/fog/storm. Blank uses the real forecast."
        required: false
        default: ""
      season:
        description: "Pin the season — spring/summer/autumn/winter. Blank uses today's date."
        required: false
        default: ""
      force:
        description: "Re-render even if the scene has not changed"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # paints the live weather into the banner (between its <!--WEATHER--> markers),
      # writes bloom-header-night.svg next to it, and draws the seasonal footer
      - uses: yuki4266/living-scene@v1
        with:
          # Beijing is the ready-to-run default. Change these three values to
          # your own city if you want the sky to follow your local forecast.
          lat: "39.9042"
          lon: "116.4074"
          tz: Asia/Shanghai
          header: bloom-header.svg
          sky: "false"
          weather: ${{ inputs.weather }}
          season: ${{ inputs.season }}
          force: ${{ inputs.force }}
          commit-message: "🌦 scene sync: {state}"
