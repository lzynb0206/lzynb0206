<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <title>WorldMuse · 云览天下 — featured project</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9986D4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9986D4" stop-opacity="0.025"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="168" rx="18" fill="url(#wash)" stroke="#9986D4" stroke-opacity="0.38" stroke-width="1.2"/>
  <g transform="translate(38,85)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <ellipse rx="8" ry="23" fill="#C9BDF0" transform="rotate(0) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#C9BDF0" transform="rotate(72) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#C9BDF0" transform="rotate(144) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#C9BDF0" transform="rotate(216) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#C9BDF0" transform="rotate(288) translate(0,-17)"/>
    </g>
    <circle r="10" fill="#9986D4"/>
    <circle r="4" fill="#FFF2D8"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
    <text x="76" y="27" font-size="10" letter-spacing="1.7" fill="#9986D4">HARMONYOS · AWARD WINNER</text>
    <text x="76" y="55" font-size="23" font-weight="700" fill="#9986D4">WorldMuse · 云览天下</text>
    <text x="76" y="83" font-size="13" fill="#8b949e">A native HarmonyOS 6 cloud-museum experience for collections, history quizzes and timelines —</text><text x="76" y="102" font-size="13" fill="#8b949e">awarded by the 2025 developer program.</text>
    <g transform="translate(76,132)"><rect width="99" height="24" rx="12" fill="#9986D4" fill-opacity="0.09" stroke="#9986D4" stroke-opacity="0.48"/><text x="49.5" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#9986D4">HarmonyOS 6</text></g><g transform="translate(184,132)"><rect width="64" height="24" rx="12" fill="#9986D4" fill-opacity="0.09" stroke="#9986D4" stroke-opacity="0.48"/><text x="32" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#9986D4">ArkTS</text></g><g transform="translate(257,132)"><rect width="64" height="24" rx="12" fill="#9986D4" fill-opacity="0.09" stroke="#9986D4" stroke-opacity="0.48"/><text x="32" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#9986D4">ArkUI</text></g><g transform="translate(330,132)"><rect width="142" height="24" rx="12" fill="#9986D4" fill-opacity="0.09" stroke="#9986D4" stroke-opacity="0.48"/><text x="71" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#9986D4">Cultural Heritage</text></g>
  </g>
  <g transform="translate(821,85)" fill="none" stroke="#9986D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
