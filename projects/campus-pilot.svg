<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="860" height="170" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <title>CampusPilot AI — featured project</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4795B" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#F4795B" stop-opacity="0.025"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="858" height="168" rx="18" fill="url(#wash)" stroke="#F4795B" stroke-opacity="0.38" stroke-width="1.2"/>
  <g transform="translate(38,85)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <ellipse rx="8" ry="23" fill="#FFB49D" transform="rotate(0) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#FFB49D" transform="rotate(72) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#FFB49D" transform="rotate(144) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#FFB49D" transform="rotate(216) translate(0,-17)"/>
      <ellipse rx="8" ry="23" fill="#FFB49D" transform="rotate(288) translate(0,-17)"/>
    </g>
    <circle r="10" fill="#F4795B"/>
    <circle r="4" fill="#FFF2D8"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
    <text x="76" y="27" font-size="10" letter-spacing="1.7" fill="#F4795B">JAVA AI AGENT · FEATURED</text>
    <text x="76" y="55" font-size="23" font-weight="700" fill="#F4795B">CampusPilot AI</text>
    <text x="76" y="83" font-size="13" fill="#8b949e">A WeChat-native campus planning agent with multi-turn memory, RAG, multimodal interaction, a</text><text x="76" y="102" font-size="13" fill="#8b949e">12-task DAG and evaluator-driven output.</text>
    <g transform="translate(76,132)"><rect width="70" height="24" rx="12" fill="#F4795B" fill-opacity="0.09" stroke="#F4795B" stroke-opacity="0.48"/><text x="35" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#F4795B">Java 21</text></g><g transform="translate(155,132)"><rect width="99" height="24" rx="12" fill="#F4795B" fill-opacity="0.09" stroke="#F4795B" stroke-opacity="0.48"/><text x="49.5" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#F4795B">Spring Boot</text></g><g transform="translate(263,132)"><rect width="64" height="24" rx="12" fill="#F4795B" fill-opacity="0.09" stroke="#F4795B" stroke-opacity="0.48"/><text x="32" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#F4795B">Qwen</text></g><g transform="translate(336,132)"><rect width="64" height="24" rx="12" fill="#F4795B" fill-opacity="0.09" stroke="#F4795B" stroke-opacity="0.48"/><text x="32" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#F4795B">RAG</text></g><g transform="translate(409,132)"><rect width="78" height="24" rx="12" fill="#F4795B" fill-opacity="0.09" stroke="#F4795B" stroke-opacity="0.48"/><text x="39" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#F4795B">Task DAG</text></g>
  </g>
  <g transform="translate(821,85)" fill="none" stroke="#F4795B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M-9 -9 L0 0 L-9 9"/>
    <path d="M-20 0 H0"/>
    <animateTransform attributeName="transform" type="translate" values="821 85;826 85;821 85" dur="2.2s" repeatCount="indefinite"/>
  </g>
