<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" width="860" height="446" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif"><title>AI AGENTS field guide</title>
<rect x="1" y="1" width="858" height="444" rx="14" fill="#7F1736" fill-opacity="0.05" stroke="#7F1736" stroke-opacity="0.4" stroke-width="1.2"/>
<g transform="translate(30,26)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="0" cy="-6.5" r="3.4" fill="#5A0B22"/><circle cx="6.2" cy="-2" r="3.4" fill="#5A0B22"/><circle cx="3.8" cy="5.3" r="3.4" fill="#5A0B22"/><circle cx="-3.8" cy="5.3" r="3.4" fill="#5A0B22"/><circle cx="-6.2" cy="-2" r="3.4" fill="#5A0B22"/></g><circle r="2.8" fill="#5A0B22"/></g>
<text x="48" y="30" font-size="11" letter-spacing="2" fill="#8b949e">AI AGENTS</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><rect x="30" y="60" width="34" height="34" rx="9" fill="#7F1736" fill-opacity="0.12"/><text x="47" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#7F1736">A</text><text x="78" y="63" font-size="14" font-weight="700" fill="#7F1736">AI Agent</text><text x="78" y="81" font-size="13" fill="#8b949e">The centre of my current work: turning an LLM into a dependable product with routing, memory, tools, validation and safe</text><text x="78" y="98" font-size="13" fill="#8b949e">execution boundaries.</text><path d="M78 109 H 812" stroke="#7F1736" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.5s" fill="freeze"/><rect x="30" y="126" width="34" height="34" rx="9" fill="#922344" fill-opacity="0.12"/><text x="47" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#922344">F</text><text x="78" y="129" font-size="14" font-weight="700" fill="#922344">Function Calling</text><text x="78" y="147" font-size="13" fill="#8b949e">Multi-round tool use with JSON schemas, parameter validation and parallel execution for independent tasks.</text><path d="M78 175 H 812" stroke="#922344" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.33s" dur="0.5s" fill="freeze"/><rect x="30" y="192" width="34" height="34" rx="9" fill="#A83E5C" fill-opacity="0.12"/><text x="47" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#A83E5C">S</text><text x="78" y="195" font-size="14" font-weight="700" fill="#A83E5C">Skills</text><text x="78" y="213" font-size="13" fill="#8b949e">Deterministic, reusable workflows that compose tools into stable business capabilities such as a daily brief or campus</text><text x="78" y="230" font-size="13" fill="#8b949e">event plan.</text><path d="M78 241 H 812" stroke="#A83E5C" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/><rect x="30" y="258" width="34" height="34" rx="9" fill="#C05A76" fill-opacity="0.12"/><text x="47" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#C05A76">R</text><text x="78" y="261" font-size="14" font-weight="700" fill="#C05A76">RAG</text><text x="78" y="279" font-size="13" fill="#8b949e">Retrieval-augmented generation over maintainable local knowledge, with explicit source and trust boundaries.</text><path d="M78 307 H 812" stroke="#C05A76" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><rect x="30" y="324" width="34" height="34" rx="9" fill="#7F1736" fill-opacity="0.12"/><text x="47" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#7F1736">M</text><text x="78" y="327" font-size="14" font-weight="700" fill="#7F1736">Multimodal</text><text x="78" y="345" font-size="13" fill="#8b949e">Text, image, speech recognition, image generation and speech synthesis connected through one conversational interface.</text><path d="M78 373 H 812" stroke="#7F1736" stroke-opacity="0.18" stroke-width="1"/></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/><rect x="30" y="390" width="34" height="34" rx="9" fill="#922344" fill-opacity="0.12"/><text x="47" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#922344">T</text><text x="78" y="393" font-size="14" font-weight="700" fill="#922344">Task DAG</text><text x="78" y="411" font-size="13" fill="#8b949e">Dependency-aware orchestration, virtual-thread execution, evaluator retries and checkpoint recovery for long agent</text><text x="78" y="428" font-size="13" fill="#8b949e">workflows.</text></g>
</svg>
